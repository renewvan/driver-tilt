[project]
name = "driver-tilt"
version = "0.0.0"  # placeholder: the git release tag is the only version source (DRIVER_VERSION)
description = "Van inclination (roll/pitch) driver: reads a GY-521 / MPU-6050 IMU over I2C and publishes level to the renewvan MQTT bus"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=1.6,<2",
    "smbus2>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["driver_tilt*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
