; node-tilt — Tilt node configuration
; ====================================================
; This file ships with the package and contains every available setting
; with a safe default. DO NOT EDIT — create a config.ini instead and
; override only what you need. config.ini is gitignored and local to
; each install.

[mqtt]
host = localhost
port = 1883
; username =
; password =
client_id = node-tilt
reconnect_min_delay = 1.0
reconnect_max_delay = 30.0

[node]
id = tilt
; Read/publish cadence. Accel-only tilt is cheap; 500 ms feels live on a
; dashboard level indicator.
update_interval_ms = 500

; I2C bus and MPU-6050 address. 0x68 with the GY-521 AD0 pin low/unconnected,
; 0x69 with AD0 high. Written as decimal or 0x-prefixed hex.
i2c_bus = 1
i2c_address = 0x68

; Which sensor axis supplies each van axis (x forward, y left, z up).
; Each value is one of +x -x +y -y +z -z; all three sensor axes must be used
; exactly once. Default = board mounted flat, component side up, X toward the
; front of the van. Face-down board: axis_z = -z (and one of x/y flipped to
; keep a right-handed frame, e.g. axis_y = -y).
axis_x = +x
axis_y = +y
axis_z = +z

; Exponential smoothing of roll/pitch, 0 < alpha <= 1 (1 = off).
smoothing_alpha = 0.2

; Samples whose acceleration magnitude is outside this band (in g) are
; treated as vehicle dynamics and skipped for smoothing. Loose by default:
; an uncalibrated MPU-6050 is often 5-15% off in scale.
gravity_min_g = 0.8
gravity_max_g = 1.25

; Republish only if roll or pitch moved >= this many degrees since the last
; publish, plus a heartbeat so retained values stay fresh. 0 = every read.
publish_deadband_deg = 0.1
heartbeat_s = 30

; Consecutive failed I2C reads before status flips to sensor_error.
error_threshold = 3
